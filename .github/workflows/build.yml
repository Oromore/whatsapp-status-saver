name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Increment version
        run: |
          # Read current versions
          CURRENT_CODE=$(grep "^VERSION_CODE=" gradle.properties | cut -d'=' -f2)
          CURRENT_NAME=$(grep "^VERSION_NAME=" gradle.properties | cut -d'=' -f2)
          
          # Increment version code
          NEW_CODE=$((CURRENT_CODE + 1))
          
          # Increment version name (e.g., 2.0 -> 2.1)
          MAJOR=$(echo $CURRENT_NAME | cut -d'.' -f1)
          MINOR=$(echo $CURRENT_NAME | cut -d'.' -f2)
          NEW_MINOR=$((MINOR + 1))
          NEW_NAME="${MAJOR}.${NEW_MINOR}"
          
          # Update gradle.properties
          sed -i "s/^VERSION_CODE=.*/VERSION_CODE=${NEW_CODE}/" gradle.properties
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${NEW_NAME}/" gradle.properties
          
          echo "Updated version from ${CURRENT_NAME} (${CURRENT_CODE}) to ${NEW_NAME} (${NEW_CODE})"
          
          # Export for later steps
          echo "VERSION_CODE=${NEW_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${NEW_NAME}" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Commit version update
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add gradle.properties
          git commit -m "Auto-increment version to ${{ env.VERSION_NAME }} (build ${{ env.VERSION_CODE }})" || echo "No changes to commit"
          git push || echo "Nothing to push"

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        if: github.event_name != 'pull_request'
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: v${{ env.VERSION_NAME }}
          name: Status Saver v${{ env.VERSION_NAME }}
          body: |
            🚀 **Status Saver v${{ env.VERSION_NAME }}**
            
            Build: ${{ env.VERSION_CODE }}
            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
